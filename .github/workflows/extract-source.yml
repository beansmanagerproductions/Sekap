name: Build and deploy Beans & Espresso Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract application source
        run: |
          set -e
          rm -rf app
          mkdir app
          unzip -q "beans-&-espresso-manager.zip" -d app
          echo "=== APP FILES ==="
          find app -maxdepth 3 -type f | sort
          echo "=== INDEX ==="
          cat app/index.html
          echo "=== MAIN ==="
          cat app/src/main.tsx
          echo "=== VITE ==="
          cat app/vite.config.ts
          echo "=== VITE ==="
          sed -i "/return {/a\\    base: './'," app/vite.config.ts
          echo "=== TYPES ==="
          cat app/src/types/index.ts
          echo "=== TABLE REFERENCES ==="
          grep -RhoE "from\([[:space:]]*[\x27\x22][^\x27\x22]+[\x27\x22]" app/src | sort -u || true
          echo "=== DATABASE ==="
          cat app/src/services/database.ts
          echo "=== package.json ==="
          cat app/package.json
          echo "=== .env.example ==="
          cat app/.env.example || true
          echo "=== supabaseClient.ts ==="
          cat app/src/services/supabaseClient.ts
          echo "=== database.ts ==="
          cat app/src/services/database.ts
          echo "=== AuthContext.tsx ==="
          cat app/src/context/AuthContext.tsx

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://dhgkscdwzhupfiacsxxi.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify web build
        working-directory: app
        run: |
          set -e
          test -f dist/index.html
          find dist -maxdepth 2 -type f -print | sort
          

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
