name: Build and deploy Beans & Espresso Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract application source
        run: |
          set -e
          rm -rf app
          mkdir app
          unzip -q "beans-&-espresso-manager.zip" -d app
          sed -i "/return {/a\\    base: './'," app/vite.config.ts
          mkdir -p app/public
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#17120f"/><circle cx="256" cy="256" r="166" fill="#f4e7d7"/><path d="M256 105c-72 0-126 65-126 151s54 151 126 151 126-65 126-151-54-151-126-151Z" fill="#4a2415"/><path d="M268 119c-38 58-43 124-25 185 15 49 11 81-10 101 49-11 88-64 88-149 0-62-20-108-53-137Z" fill="#8b542f"/><path d="M207 174c-25 34-32 80-23 125 8 38 5 66-9 86 34-18 54-59 54-113 0-39-8-72-22-98Z" fill="#c47a42"/></svg>' > app/public/beans-espresso-icon.svg
          printf '%s' '{"name":"Beans & Espresso Manager","short_name":"Beans Manager","start_url":"./","display":"standalone","background_color":"#17120f","theme_color":"#4a2415","icons":[{"src":"./beans-espresso-icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}]}' > app/public/manifest.webmanifest
          python -c 'from pathlib import Path; p=Path("app/index.html"); s=p.read_text(); s=s.replace("</head>", "<link rel=\"icon\" href=\"./beans-espresso-icon.svg\" type=\"image/svg+xml\"><link rel=\"manifest\" href=\"./manifest.webmanifest\"></head>") if "manifest.webmanifest" not in s else s; p.write_text(s)'

      - name: Apply business rules patch
        run: python scripts/patch-business-rules.py
      - name: Inspect application structure
        run: |
          set -e
          echo "=== SOURCE FILES ==="
          find app/src -maxdepth 4 -type f 2>/dev/null | sort | head -200
          echo "=== PACKAGE ==="
          cat app/package.json
          echo "=== SUPABASE REFERENCES ==="
          grep -RIl "supabase" app/src --include='*.ts' --include='*.tsx' 2>/dev/null | head -50 || true
          echo "=== KEY SOURCE ==="
          for f in app/src/components/inventory/InventoryView.tsx app/src/components/dashboard/DashboardView.tsx app/src/components/production/ProductionView.tsx app/src/services/database.ts app/src/types/index.ts app/src/App.tsx; do
            echo "--- $f ---"
            sed -n '1,260p' "$f"
          done

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: bem-source-inspection
          path: app/src
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript validation
        working-directory: app
        run: npm run lint

      - name: Build web
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://dhgkscdwzhupfiacsxxi.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify web build
        working-directory: app
        run: |
          set -e
          test -f dist/index.html
          find dist -maxdepth 2 -type f -print | sort
          

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
